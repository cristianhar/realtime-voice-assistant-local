version: '3.8'

services:
  # --------------------------------------------------------------------------
  # 1. Ollama LLM Service (Llama 3.2 3B & Dense Embeddings)
  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: voice-assistant-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # --------------------------------------------------------------------------
  # 2. Automated Model Puller (Auto-pulls llama3.2:3b if not present)
  # --------------------------------------------------------------------------
  ollama-init:
    image: curlimages/curl:latest
    container_name: voice-assistant-ollama-init
    restart: "no"
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
        echo 'Esperando a que Ollama esté disponible...';
        until curl -s http://ollama:11434/api/tags > /dev/null; do
          sleep 2;
        done;
        echo 'Verificando y descargando LLaMA 3.2 3B...';
        curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"llama3.2:3b\"}';
        echo '✓ Modelo LLaMA 3.2 3B listo para inferencia.';
      "

  # --------------------------------------------------------------------------
  # 3. Realtime Voice Assistant Backend & Web App
  # --------------------------------------------------------------------------
  voice-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-assistant-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - USE_HTTPS=1
    volumes:
      - ./voice_assistant.db:/app/voice_assistant.db
      - ./models:/app/models
      - ./certs:/app/certs
    depends_on:
      - ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_data:
    driver: local
